[package]
name = "evolving-dob-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
blake2b-ref = "0.3"
clap = { version = "=4.5.49", features = ["derive"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
